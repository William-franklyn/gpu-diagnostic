<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 800" font-family="ui-monospace, 'IBM Plex Mono', 'Cascadia Code', Consolas, monospace">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0fe58a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e58a"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d8a86"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#0fe58a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0fe58a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1420" height="800" fill="#05080a"/>
  <rect x="0" y="0" width="1420" height="800" fill="url(#glow)"/>
  <rect x="0" y="0" width="1420" height="800" fill="url(#grid)"/>

  <!-- Header -->
  <text x="40" y="46" fill="#6d8a86" font-size="14" letter-spacing="2">ROOT@GPU:~$ CAT ARCHITECTURE.TXT</text>
  <rect x="402" y="34" width="10" height="16" fill="#00e58a">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="84" fill="#d9fdf0" font-size="28" font-weight="700">System architecture</text>
  <line x1="40" y1="100" x2="1380" y2="100" stroke="#1c2b2c" stroke-width="1"/>

  <!-- ===================== COLAB NODE ===================== -->
  <g>
    <rect x="50" y="290" width="280" height="200" rx="10" fill="#0d1417" stroke="#1c2b2c" stroke-width="1.5"/>
    <rect x="50" y="290" width="280" height="200" rx="10" fill="none" stroke="#00e58a" stroke-opacity="0.25" stroke-width="1"/>
    <!-- chip icon -->
    <g transform="translate(72,308)" stroke="#00e58a" stroke-width="1.6" fill="none" stroke-linecap="round">
      <rect x="6" y="6" width="16" height="16" rx="2"/>
      <path d="M11 0v6M17 0v6M11 22v6M17 22v6M0 11h6M0 17h6M22 11h6M22 17h6"/>
      <circle cx="14" cy="14" r="2.4" fill="#00e58a" stroke="none"/>
    </g>
    <text x="110" y="324" fill="#d9fdf0" font-size="16" font-weight="700">COLAB NOTEBOOK</text>
    <text x="72" y="356" fill="#6d8a86" font-size="12.5">Python control panel (Gradio)</text>
    <line x1="72" y1="370" x2="308" y2="370" stroke="#1c2b2c"/>
    <text x="72" y="394" fill="#9fb7b3" font-size="12.5">&gt; compiles &amp; runs diag.cu</text>
    <text x="72" y="414" fill="#9fb7b3" font-size="12.5">&gt; NVML + CUDA kernels on a</text>
    <text x="86" y="431" fill="#9fb7b3" font-size="12.5">real GPU</text>
    <text x="72" y="455" fill="#9fb7b3" font-size="12.5">&gt; only ever calls OUT —</text>
    <text x="86" y="472" fill="#9fb7b3" font-size="12.5">no tunnel, no public address</text>
  </g>

  <!-- ===================== VERCEL NODE (hub) ===================== -->
  <g>
    <rect x="580" y="180" width="300" height="300" rx="10" fill="#0d1417" stroke="#00e58a" stroke-width="1.5"/>
    <!-- triangle / serverless icon -->
    <g transform="translate(602,200)" stroke="#00e58a" stroke-width="1.6" fill="none" stroke-linejoin="round">
      <path d="M11 2 L21 20 L1 20 Z"/>
    </g>
    <text x="636" y="216" fill="#d9fdf0" font-size="16" font-weight="700">VERCEL</text>
    <text x="602" y="240" fill="#6d8a86" font-size="12.5">serverless functions + static page</text>
    <line x1="602" y1="254" x2="858" y2="254" stroke="#1c2b2c"/>

    <!-- route chips -->
    <g font-size="12" font-weight="600">
      <rect x="602" y="266" width="258" height="24" rx="4" fill="#0a1113" stroke="#1c2b2c"/>
      <text x="612" y="282" fill="#5cc2a4">GET</text><text x="650" y="282" fill="#d9fdf0">/api/status</text>

      <rect x="602" y="296" width="258" height="24" rx="4" fill="#0a1113" stroke="#1c2b2c"/>
      <text x="612" y="312" fill="#5cc2a4">GET</text><text x="650" y="312" fill="#d9fdf0">/api/results</text>

      <rect x="602" y="326" width="258" height="24" rx="4" fill="#0a1113" stroke="#1c2b2c"/>
      <text x="612" y="342" fill="#ffb020">POST</text><text x="650" y="342" fill="#d9fdf0">/api/run</text><text x="826" y="342" fill="#6d8a86" font-weight="400">key</text>

      <rect x="602" y="356" width="258" height="24" rx="4" fill="#0a1113" stroke="#1c2b2c"/>
      <text x="612" y="372" fill="#ffb020">POST</text><text x="650" y="372" fill="#d9fdf0">/api/poll</text><text x="826" y="372" fill="#6d8a86" font-weight="400">key</text>

      <rect x="602" y="386" width="258" height="24" rx="4" fill="#0a1113" stroke="#1c2b2c"/>
      <text x="612" y="402" fill="#ffb020">POST</text><text x="650" y="402" fill="#d9fdf0">/api/results</text><text x="826" y="402" fill="#6d8a86" font-weight="400">key</text>
    </g>
    <line x1="602" y1="424" x2="858" y2="424" stroke="#1c2b2c"/>
    <text x="602" y="446" fill="#9fb7b3" font-size="12.5">&gt; also serves index.html —</text>
    <text x="616" y="463" fill="#9fb7b3" font-size="12.5">this dashboard</text>
  </g>

  <!-- ===================== REDIS NODE ===================== -->
  <g>
    <rect x="600" y="580" width="260" height="130" rx="10" fill="#0d1417" stroke="#1c2b2c" stroke-width="1.5"/>
    <!-- db cylinder icon -->
    <g transform="translate(622,598)" stroke="#00e58a" stroke-width="1.6" fill="none">
      <ellipse cx="11" cy="5" rx="11" ry="4.5"/>
      <path d="M0 5v14c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5V5"/>
      <path d="M0 12.5c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5" opacity="0.6"/>
    </g>
    <text x="658" y="615" fill="#d9fdf0" font-size="15" font-weight="700">UPSTASH REDIS</text>
    <text x="622" y="642" fill="#9fb7b3" font-size="12.5">results + status, as JSON</text>
    <text x="622" y="661" fill="#6d8a86" font-size="12.5">free tier, via Vercel Storage</text>
  </g>

  <!-- ===================== BROWSER NODE ===================== -->
  <g>
    <rect x="1090" y="290" width="280" height="200" rx="10" fill="#0d1417" stroke="#1c2b2c" stroke-width="1.5"/>
    <rect x="1090" y="290" width="280" height="200" rx="10" fill="none" stroke="#00e58a" stroke-opacity="0.25" stroke-width="1"/>
    <!-- browser window icon -->
    <g transform="translate(1112,308)" stroke="#00e58a" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="24" height="18" rx="2"/>
      <path d="M0 5.5h24"/>
      <circle cx="4" cy="2.7" r="0.9" fill="#00e58a" stroke="none"/>
      <circle cx="7.2" cy="2.7" r="0.9" fill="#00e58a" stroke="none"/>
    </g>
    <text x="1146" y="324" fill="#d9fdf0" font-size="16" font-weight="700">VISITOR BROWSER</text>
    <text x="1112" y="356" fill="#6d8a86" font-size="12.5">the dashboard, open anywhere</text>
    <line x1="1112" y1="370" x2="1348" y2="370" stroke="#1c2b2c"/>
    <text x="1112" y="394" fill="#9fb7b3" font-size="12.5">&gt; polls every 10s (4s while</text>
    <text x="1126" y="411" fill="#9fb7b3" font-size="12.5">a run is in progress)</text>
    <text x="1112" y="435" fill="#9fb7b3" font-size="12.5">&gt; Run again needs a deploy</text>
    <text x="1126" y="452" fill="#9fb7b3" font-size="12.5">key, saved in localStorage</text>
  </g>

  <!-- ===================== ARROWS: Colab <-> Vercel ===================== -->
  <line x1="332" y1="330" x2="576" y2="330" stroke="#00e58a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="338" y="320" fill="#00e58a" font-size="12.5" font-weight="700">[1]</text>
  <text x="362" y="320" fill="#9fb7b3" font-size="12.5">POST /api/poll — every 5s</text>

  <line x1="576" y1="385" x2="332" y2="385" stroke="#6d8a86" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="338" y="403" fill="#6d8a86" font-size="12.5" font-weight="700">[2]</text>
  <text x="362" y="403" fill="#6d8a86" font-size="12.5">{ run: true } if requested</text>

  <line x1="332" y1="445" x2="576" y2="445" stroke="#00e58a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="338" y="435" fill="#00e58a" font-size="12.5" font-weight="700">[3]</text>
  <text x="362" y="435" fill="#9fb7b3" font-size="12.5">POST /api/results — per run</text>

  <!-- ===================== ARROWS: Browser <-> Vercel ===================== -->
  <line x1="1088" y1="330" x2="884" y2="330" stroke="#00e58a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="890" y="320" fill="#00e58a" font-size="12.5" font-weight="700">[4]</text>
  <text x="914" y="320" fill="#9fb7b3" font-size="12.5">POST /api/run (“Run again”)</text>

  <line x1="884" y1="410" x2="1088" y2="410" stroke="#00e58a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="890" y="400" fill="#00e58a" font-size="12.5" font-weight="700">[5]</text>
  <text x="914" y="400" fill="#9fb7b3" font-size="12.5">GET /api/status, /api/results</text>

  <!-- ===================== ARROW: Vercel <-> Redis ===================== -->
  <line x1="730" y1="482" x2="730" y2="576" stroke="#00e58a" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="742" y="518" width="96" height="20" fill="#05080a"/>
  <text x="746" y="533" fill="#00e58a" font-size="12.5" font-weight="700">[6]</text>
  <text x="770" y="533" fill="#9fb7b3" font-size="12.5">GET / SET</text>

  <!-- ===================== FOOTNOTE ===================== -->
  <rect x="310" y="730" width="800" height="50" rx="6" fill="#0a1113" stroke="#00e58a" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="710" y="760" fill="#9fb7b3" font-size="13" text-anchor="middle">Colab only ever calls <tspan fill="#00e58a" font-weight="700">out</tspan> to the website — no tunnel or public address needed.</text>
</svg>
